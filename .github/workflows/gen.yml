name: Generate snippet.json

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo install cargo-snippet --features="binaries"
      - run: ./snippet.sh
      - run: cat snippet.json
      - run: |
        git config user.email "doubsing0125@gmail.com"
        git config user.name "KA37RI"
      - run: |
        git add snippet.json
        git commit -m "[Actions] Update snippet.json"
        git push

